name: Build and tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Build standalone HTML
        run: npm run build
      - name: Run data and bundle tests
        run: npm test
      - name: Chromium version
        run: |
          command -v chromium || command -v google-chrome || command -v google-chrome-stable
      - name: Browser smoke test (file HTML)
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: franklin-planner-single-html
          path: dist/franklin-planner.html
          if-no-files-found: error
