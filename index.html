<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>플래너</title>
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<div class="shell" id="app">
  <aside class="sidebar" aria-label="플래너 메뉴">
    <div class="brand"><span class="brand-mark">P</span><div><strong>플래너</strong><small>MY TASKS</small></div></div>
    <div class="side-group">
      <span class="side-label">WORKSPACE</span>
      <button class="side-link active" data-view="active"><svg class="inline-icon nav-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg> 업무 플래너</button>
      <button class="side-link" data-view="completed"><svg class="inline-icon nav-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 6 9 17l-5-5"/></svg> 완료한 업무</button>
      <button class="side-link" data-view="trash"><svg class="inline-icon nav-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg> 휴지통</button>
    </div>
    <div class="side-group"><span class="side-label">데이터 및 테마</span>
      <button class="side-link" data-action="export"><svg class="inline-icon nav-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3v12m-5-5 5 5 5-5"/><path d="M4 17v4h16v-4"/></svg> JSON 내보내기</button>
      <button class="side-link" data-action="import"><svg class="inline-icon nav-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 16V4m-5 5 5-5 5 5"/><path d="M4 17v4h16v-4"/></svg> JSON 가져오기</button>
      <button class="side-link" data-action="copy-raw"><svg class="inline-icon nav-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg> 저장 원본 복사</button>
      <button class="side-link" id="theme-toggle" data-action="theme-toggle" aria-pressed="false"><svg class="inline-icon nav-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14a8 8 0 0 1-10-10A8 8 0 1 0 20 14Z"/></svg> <span id="theme-label">다크 모드</span></button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </div>
    <div class="side-foot"><span class="status-dot"></span> <span id="storage-status">저장소 확인 중</span><p>이 브라우저의 로컬 저장소에 저장됩니다. 정기적으로 JSON 백업을 보관하십시오.</p></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button id="menu-toggle" class="icon-btn mobile-only" aria-label="메뉴 토글"><svg class="inline-icon nav-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="breadcrumb">WORKSPACE <span>/</span> <strong id="view-heading">업무 플래너</strong></div>
      <div class="header-actions"><span id="revision-label" class="revision">revision —</span><button id="refresh" class="icon-btn" title="저장소 다시 읽기" aria-label="새로고침"><svg class="inline-icon nav-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M5 9a8 8 0 0 1 14-2l1 5M4 12l1 5a8 8 0 0 0 14-2"/></svg></button></div>
    </header>
    <section id="readonly-banner" class="notice danger" hidden role="alert">
      <strong id="readonly-title">저장소 오류</strong>
      <p id="readonly-details"></p>
      <label class="preserved-check"><input type="checkbox" id="recovery-preserved"> 원본을 별도 파일 또는 텍스트로 보존했습니다.</label><div class="notice-actions"><button data-action="export">원본 내보내기</button><button data-action="copy-raw">원본 복사</button>
      <button data-action="recovery-file">백업 복구</button><button data-action="reset" class="danger-btn">저장 데이터 초기화</button></div>
    </section>
    <section class="page-heading">
      <div><span class="eyebrow" id="today-label"></span><h1 id="page-title">업무 플래너</h1><p id="page-subtitle">중요한 업무를 우선순위에 맞춰 정리합니다.</p></div>
      <div class="page-actions"><button class="btn subtle" id="completion-mode" data-action="toggle-completion" aria-pressed="false">완료 모드 OFF</button><button class="btn subtle" id="rollover-btn" data-action="rollover">내일로 이월</button><button class="btn primary" id="new-task" data-action="new">+ 업무 추가</button></div>
    </section>
    <section id="mode-status" class="mode-status" role="status" hidden>✓ 완료 모드가 켜졌습니다. 업무별 완료 체크가 표시됩니다.</section>
    <section id="summary" class="summary" aria-label="업무 현황"></section>
    <section class="toolbar" aria-label="검색과 필터">
      <label class="search-field"><svg class="inline-icon nav-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><span class="sr-only">업무 검색</span><input type="search" id="search" placeholder="제목·내용·태그 검색" autocomplete="off"></label>
      <label class="select-label"><span class="sr-only">등급</span><select id="filter-grade"><option value="">전체 등급</option><option value="A">A · 매우 중요</option><option value="B">B · 중요</option><option value="C">C · 사소</option></select></label>
      <label class="select-label"><span class="sr-only">태그 결합 방식</span><select id="tag-mode"><option value="AND">태그 모두 포함</option><option value="OR">태그 하나 이상</option></select></label>
      <button class="btn subtle" id="clear-filters" data-action="clear-filters" hidden>필터 해제</button>
    </section>
    <section id="tag-filters" class="tag-row" aria-label="태그 필터"></section>
    <section id="content" class="content-area" aria-live="polite"></section>
    <section class="footer-actions" id="footer-actions"></section>
  </main>
  <nav class="mobile-dock" aria-label="모바일 화면 이동">
    <div class="mobile-dock-pill">
      <button type="button" data-view="active" class="mobile-dock-item active" aria-current="page"><svg class="inline-icon nav-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><small>업무</small></button>
      <button type="button" data-view="completed" class="mobile-dock-item"><svg class="inline-icon nav-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 6 9 17l-5-5"/></svg><small>완료</small></button>
      <button type="button" data-view="trash" class="mobile-dock-item"><svg class="inline-icon nav-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg><small>휴지통</small></button>
      <button type="button" id="mobile-more" class="mobile-dock-item"><svg class="inline-icon nav-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg><small>메뉴</small></button>
    </div>
    <button type="button" class="mobile-fab" data-action="new" aria-label="새 업무 추가">+</button>
  </nav>
  <div class="editor-backdrop" id="editor-backdrop" hidden>
    <section class="editor" role="dialog" aria-modal="true" aria-labelledby="editor-title">
      <header class="editor-header"><div><span class="eyebrow">TASK EDITOR</span><h2 id="editor-title">업무 추가</h2></div><button type="button" id="editor-close" class="icon-btn" aria-label="닫기">×</button></header>
      <form id="task-form">
        <input type="hidden" name="taskId" id="task-id">
        <label>업무 제목 <span class="required">*</span><input id="task-title" name="title" required maxlength="200" placeholder="해야 할 업무를 입력하세요"></label>
        <label>주요 내용<textarea name="body" id="task-body" maxlength="20000" rows="5" placeholder="진행 내용, 참고 사항"></textarea></label>
        <div class="two-col"><label>우선순위<select name="grade" id="task-grade" aria-describedby="grade-hint"><option value="A">A · 매우 중요</option><option value="B">B · 중요</option><option value="C">C · 사소</option></select><small id="grade-hint" class="grade-hint">A · 매우 중요 — 핵심 목표와 최우선 과제</small></label><label>실행 예정일<input name="scheduledDate" id="task-scheduled" type="date"></label></div>
        <div class="two-col"><label>처리기한<input name="dueDate" id="task-due" type="date"></label><label class="editor-tags-field">태그 <small>쉼표 또는 Enter로 추가</small><input name="tags" id="task-tags" list="tag-suggestions" autocomplete="off" placeholder="보고, 검토"><datalist id="tag-suggestions"></datalist><span class="tag-editor-chips" id="tag-editor-chips" aria-label="입력한 태그"></span></label></div>
        <p id="form-error" role="alert" class="form-error" hidden></p>
        <div class="dialog-actions"><button type="button" id="editor-cancel" class="btn subtle">취소</button><button class="btn primary" type="submit">저장</button></div>
      </form>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>
<script type="module" src="./src/ui.js"></script>
</body>
</html>
